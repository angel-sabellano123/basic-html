<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Matcha is Matching</title>
    <link rel="stylesheet" href="../../css/login/login.css">
</head>
<body>
    <div class="container">
        <h1 class="matcha">Matchea's Matching</h1>
        <div class="wrapper">
            <form action="../profile/profile.html">
                <h2>Log In</h2>
                <div class="input-box">
                    <label>Username</label>
                    <input type="text"
                           placeholder="Enter your username"
                           required>
                </div>
                <div class="input-box">
                    <label>Password</label>
                    <input type="password"
                           placeholder="Enter your password"
                           required>
                </div>
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Log In</button>
                <p class="signup">
                    Don't have an account?
                    <a href="#">Sign Up</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
